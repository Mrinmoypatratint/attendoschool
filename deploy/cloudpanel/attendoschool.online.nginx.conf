# ====================================================================
# CloudPanel Nginx Vhost Configuration: attendoschool.online
# Domain: attendoschool.online & www.attendoschool.online
# Architecture: High-Performance Static Frontend + PM2 Node.js API Proxy
# Path: /home/attendoschool/htdocs/attendoschool.online
# ====================================================================

upstream attendoschool_api_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendoschool.online www.attendoschool.online;

    # Document Root points directly to built Vite React application
    root /home/attendoschool/htdocs/attendoschool.online/frontend/dist;
    index index.html;

    # SSL Certificates managed by CloudPanel / Let's Encrypt
    ssl_certificate /etc/nginx/ssl-certificates/attendoschool.online.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/attendoschool.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Request limits matching Express payload limits (photo upload / bulk import)
    client_max_body_size 35M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy -> PM2 Node.js Backend on 127.0.0.1:3000
    location /api/ {
        proxy_pass http://attendoschool_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;
        proxy_send_timeout 60s;
    }

    # 2. Health check probe endpoint
    location = /health {
        proxy_pass http://attendoschool_api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Direct Static Assets Caching (1 Year immutable for hashed bundles)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 4. SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Deny access to sensitive hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
