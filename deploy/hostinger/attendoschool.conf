# ====================================================================
# Nginx Configuration for AttendoSchool on Hostinger VPS
# Domain: attendoschool.optinetinnovations.in
# Serves: Frontend (Vite React SPA) + Backend API (Node.js Express / PM2)
# ====================================================================

upstream attendoschool_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name attendoschool.optinetinnovations.in;

    # Maximum file upload size for student photos and bulk attendance sheets
    client_max_body_size 30M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Static Files
    root /var/www/attendoschool/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy -> Express Backend on port 5000
    location /api/ {
        proxy_pass http://attendoschool_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;
    }

    # 2. Health check probe endpoint
    location = /health {
        proxy_pass http://attendoschool_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Direct Static Assets Caching (1 Year)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 4. SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
