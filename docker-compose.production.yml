services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - backup_data:/app/backups/private
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  backup-worker:
    build:
      context: .
      dockerfile: scripts/backup/Dockerfile
      args:
        PG_MAJOR: ${BACKUP_PG_MAJOR:-16}
    restart: unless-stopped
    env_file: .env.production
    environment:
      BACKUP_DIR: /app/backups/private
    # Liveness checks see web + worker PIDs. This is a single-host file queue.
    pid: "service:backend"
    depends_on:
      - backend
    volumes:
      - backup_data:/app/backups/private

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  backup_data:
