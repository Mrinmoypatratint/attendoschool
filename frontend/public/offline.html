<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AttendoSchool — offline</title>
  <style>
    :root { --fg: #282c3f; --muted: #696e79; --primary: #e11d55; --border: #eaeaec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f5f5f6; color: var(--fg); }
    main { width: 100%; max-width: 360px; background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 28px 24px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0 0 20px; }
    button { width: 100%; min-height: 44px; border: 0; border-radius: 4px; background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: .025em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <img src="attendo-school-logo.png" alt="AttendoSchool">
    <h1>You're offline</h1>
    <p>AttendoSchool needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="window.location.replace('https://attendoschool.online/')">Retry</button>
  </main>
  <script>window.addEventListener('online', function () { window.location.replace('https://attendoschool.online/'); });</script>
</body>
</html>
