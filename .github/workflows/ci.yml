# ===========================================================================
# AttendoSchool — Continuous Integration & Continuous Deployment (CI/CD)
# Hostinger VPS (attendoschool.online) + Node.js 20 LTS + PM2
# ===========================================================================
name: CI/CD — Test, Build & Production Deploy

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  actions: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1 — PRE-FLIGHT CHECKS
  # =========================================================================
  pre-checks:
    name: "Pre-Flight: Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security — Scan for Leaked Secrets
        run: |
          echo "Scanning diff for potential secret leaks..."
          ISSUES=0

          if git diff origin/main...HEAD -- ':(exclude).env.example' ':(exclude).env.production.example' ':(exclude)*.md' 2>/dev/null | \
            grep -iE '(password\s*[:=]\s*["\x27][^"\x27]{6,}|api[_-]?key\s*[:=]\s*["\x27][A-Za-z0-9]{16,}|private[_-]?key\s*[:=]\s*["\x27]-----BEGIN)' ; then
            echo "::warning::Potential secret detected in diff. Please review before merging."
            ISSUES=$((ISSUES + 1))
          fi

          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '^\.env$|^\.env\.(local|development|production)$|serviceAccount.*\.json$' ; then
            echo "::error::Sensitive file (.env or serviceAccount) detected in commit!"
            ISSUES=$((ISSUES + 1))
          fi

          if [ "$ISSUES" -eq 0 ]; then
            echo "✅ No secrets or sensitive files detected in diff."
            echo "- **Security Scan:** ✅ No leaked secrets detected" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # STAGE 2 — BACKEND CI
  # =========================================================================
  backend-ci:
    name: "Backend: TypeScript Build & Test Suite"
    needs: [pre-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Backend TypeScript Compile
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: ./backend
        run: npm run test

      - name: Backend CI Summary
        if: always()
        run: |
          echo "### ⚙️ Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Build:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3 — FRONTEND CI
  # =========================================================================
  frontend-ci:
    name: "Frontend: TypeScript Check & Vite Build"
    needs: [pre-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript Strict Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Frontend Vite Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: '/api'
        run: npm run build

      - name: Frontend CI Summary
        if: always()
        run: |
          echo "### 🎨 Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Check:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vite Production Build:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 4 — PRODUCTION DEPLOYMENT TO HOSTINGER VPS
  # =========================================================================
  deploy-vps:
    name: "Deploy: Hostinger VPS (attendoschool.online)"
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "===================================================================="
            echo "🚀 Starting Hostinger VPS Deployment for attendoschool.online"
            echo "Commit: ${{ github.sha }}"
            echo "===================================================================="
            cd /home/attendoschool/htdocs/attendoschool.online
            git checkout -- frontend/package-lock.json 2>/dev/null || true
            git pull origin main
            echo "🔨 Compiling Backend TypeScript..."
            npm --prefix backend run build
            echo "🔨 Building Frontend React SPA with Vite..."
            npm --prefix frontend run build
            echo "⚡ Reloading PM2 backend cluster..."
            pm2 reload ecosystem.config.cjs --env production
            pm2 save
            echo "✅ Deployment finished successfully!"

      - name: Verify Live Production Health
        run: |
          echo "Checking https://attendoschool.online/api/health..."
          MAX_RETRIES=6
          HEALTHY=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 15 "https://attendoschool.online/api/health" 2>/dev/null || echo "000")
            echo "Attempt ${i}/${MAX_RETRIES}: HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              HEALTHY=true
              cat /tmp/health.json
              echo ""
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" = "false" ]; then
            echo "::error::Production health check failed after ${MAX_RETRIES} attempts!"
            exit 1
          fi

      - name: Production Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Host | \`attendoschool.online\` (Hostinger VPS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ SUCCESS — DEPLOYED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Live URL | [https://attendoschool.online](https://attendoschool.online) |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Probe | [https://attendoschool.online/api/health](https://attendoschool.online/api/health) |" >> $GITHUB_STEP_SUMMARY
