# ===========================================================================
# AttendoSchool — Continuous Integration (CI)
# Triggers: Pushes to developer branches (auto-test, compare, auto-merge, auto-deploy)
# ===========================================================================
name: CI — Lint, Test, Build, Security

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-pages'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  actions: write

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1 — PRE-FLIGHT CHECKS
  # =========================================================================
  pre-checks:
    name: "Pre-Flight: Commit & Security Scan"
    runs-on: ubuntu-latest
    outputs:
      has_migration: ${{ steps.migration.outputs.detected }}
      has_destructive: ${{ steps.migration.outputs.destructive }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Commit Integrity
        run: |
          echo "### 🔍 Pre-Flight Checks" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Security — Scan for Leaked Secrets
        run: |
          echo "Scanning diff for potential secret leaks..."
          ISSUES=0

          if git diff origin/main...HEAD -- ':(exclude).env.example' ':(exclude).env.production.example' ':(exclude)*.md' 2>/dev/null | \
            grep -iE '(password\s*[:=]\s*["\x27][^"\x27]{6,}|api[_-]?key\s*[:=]\s*["\x27][A-Za-z0-9]{16,}|private[_-]?key\s*[:=]\s*["\x27]-----BEGIN)' ; then
            echo "::warning::Potential secret detected in diff. Please review before merging."
            ISSUES=$((ISSUES + 1))
          fi

          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '^\.env$|^\.env\.(local|development|production)$|serviceAccount.*\.json$' ; then
            echo "::error::Sensitive file (.env or serviceAccount) detected in commit!"
            ISSUES=$((ISSUES + 1))
          fi

          if [ "$ISSUES" -eq 0 ]; then
            echo "✅ No secrets or sensitive files detected in diff."
            echo "- **Security Scan:** ✅ No leaked secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Security Scan:** ⚠️ $ISSUES potential issues found — review required" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Database Migration Detection
        id: migration
        run: |
          MIGRATION_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '^database/(migrations|schema\.sql|seed\.sql)' || true)

          if [ -n "$MIGRATION_FILES" ]; then
            echo "detected=true" >> $GITHUB_OUTPUT
            echo "::warning::Database migration files changed. Manual review required before production deployment."
            echo "### ⚠️ Database Migration Detected" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$MIGRATION_FILES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            if echo "$MIGRATION_FILES" | xargs -I{} git diff origin/main...HEAD -- {} 2>/dev/null | \
              grep -iE '(DROP\s+(TABLE|DATABASE|INDEX|COLUMN)|TRUNCATE\s+TABLE|DELETE\s+FROM.*WHERE\s+1|ALTER\s+TABLE.*DROP)'; then
              echo "destructive=true" >> $GITHUB_OUTPUT
              echo "::error::DESTRUCTIVE database operation detected! Production auto-deploy will be blocked."
              echo "- **Destructive Migration:** 🚫 BLOCKED — Manual approval required" >> $GITHUB_STEP_SUMMARY
            else
              echo "destructive=false" >> $GITHUB_OUTPUT
              echo "- **Migration Type:** Non-destructive (additive)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "detected=false" >> $GITHUB_OUTPUT
            echo "destructive=false" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # STAGE 2 — BACKEND CI
  # =========================================================================
  backend-ci:
    name: "Backend: TypeScript Build & Test Suite"
    needs: [pre-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Backend TypeScript Compile
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long-for-testing
        run: npm run test

      - name: Backend CI Summary
        if: always()
        run: |
          echo "### ⚙️ Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Build:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3 — FRONTEND CI
  # =========================================================================
  frontend-ci:
    name: "Frontend: TypeScript Check & Vite Build"
    needs: [pre-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript Strict Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Frontend Vite Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: '/api'
        run: npm run build

      - name: Frontend CI Summary
        if: always()
        run: |
          echo "### 🎨 Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Check:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vite Production Build:** ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 4 — CONFLICT DETECTION, AUTO-PR & AUTO-MERGE (COMPARE, MERGE, DEPLOY)
  # =========================================================================
  conflict-check-and-pr:
    name: "Merge Safety: Conflict Detection & Auto-PR"
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    concurrency:
      # All developer branches target main. Serialize the final merge decision
      # so two green runs cannot both validate against an outdated main.
      group: merge-to-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare Branch vs Main
        id: compare
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git fetch origin main
          git fetch origin "${BRANCH}"

          LOCAL_HEAD=$(git rev-parse "origin/${BRANCH}" 2>/dev/null || git rev-parse HEAD)
          REMOTE_HEAD=$(git rev-parse origin/main)
          AHEAD=$(git rev-list --count origin/main.."origin/${BRANCH}" 2>/dev/null || echo "0")
          BEHIND=$(git rev-list --count "origin/${BRANCH}"..origin/main 2>/dev/null || echo "0")

          echo "### 📊 Branch Comparison Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Branch | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source HEAD | \`${LOCAL_HEAD:0:8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target HEAD | \`${REMOTE_HEAD:0:8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commits Ahead | ${AHEAD} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commits Behind | ${BEHIND} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$AHEAD" -eq 0 ]; then
            echo "already_merged=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Branch is already up-to-date with main." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "already_merged=false" >> $GITHUB_OUTPUT

          echo "#### Changed Files" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          git diff --stat origin/main..HEAD >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Conflict Detection (Safe Dry-Run)
        id: conflict
        if: steps.compare.outputs.already_merged != 'true'
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B _ci_merge_test origin/main

          if git merge --no-commit --no-ff "origin/${BRANCH}" 2>/dev/null; then
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "#### ✅ Merge Conflict Check: CLEAN" >> $GITHUB_STEP_SUMMARY
            echo "No merge conflicts detected. Safe to merge." >> $GITHUB_STEP_SUMMARY
            git merge --abort 2>/dev/null || git reset --hard origin/main
          else
            echo "conflict=true" >> $GITHUB_OUTPUT
            echo "#### ⚠️ Merge Conflict Check: CONFLICTS DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            git diff --name-only --diff-filter=U | while read f; do
              echo "| \`${f}\` | ❌ Conflict |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Merge \`main\` into \`${BRANCH}\` locally, resolve conflicts, and push again." >> $GITHUB_STEP_SUMMARY
            git merge --abort 2>/dev/null || git reset --hard origin/main
          fi

      - name: Create or Update Pull Request
        id: create_pr
        if: |
          steps.compare.outputs.already_merged != 'true' &&
          steps.conflict.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          PR_NUM=$(gh pr list --head "${BRANCH}" --base main --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          MIGRATION_NOTE=""
          if [ "${{ needs.pre-checks.outputs.has_migration }}" = "true" ]; then
            MIGRATION_NOTE="⚠️ **Database migration detected** — review before merging."
          fi
          if [ "${{ needs.pre-checks.outputs.has_destructive }}" = "true" ]; then
            MIGRATION_NOTE="🚫 **DESTRUCTIVE database migration detected** — manual approval required."
          fi

          PR_BODY=$(printf '%s\n' \
            "## Auto-Generated Pull Request" \
            "" \
            "**Branch:** \`${BRANCH}\` → \`main\`" \
            "**CI Status:** ✅ All checks passed (Backend Build + Test Suite + Frontend Build)" \
            "**Conflicts:** ✅ None detected" \
            "" \
            "${MIGRATION_NOTE}" \
            "" \
            "---" \
            "*This PR was automatically created by the CI pipeline after all checks passed.*")

          if [ -n "$PR_NUM" ]; then
            echo "Updating existing PR #${PR_NUM} for ${BRANCH}..."
            gh pr edit "$PR_NUM" --body "$PR_BODY" 2>/dev/null || true
            echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
            echo "- **Pull Request:** Updated [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM})" >> $GITHUB_STEP_SUMMARY
          else
            echo "Creating new PR for ${BRANCH} → main..."
            NEW_PR=$(gh pr create \
              --head "${BRANCH}" \
              --base main \
              --title "Auto: Merge ${BRANCH} into main" \
              --body "$PR_BODY" \
              --no-maintainer-edit 2>&1 || true)
            echo "- **Pull Request:** Created ${NEW_PR}" >> $GITHUB_STEP_SUMMARY
            PR_NUM=$(gh pr list --head "${BRANCH}" --base main --state open --json number -q '.[0].number' 2>/dev/null || echo "")
            echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Merge Pull Request into main & Deploy
        if: |
          steps.compare.outputs.already_merged != 'true' &&
          steps.conflict.outputs.conflict != 'true' &&
          needs.pre-checks.outputs.has_destructive != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          TESTED_HEAD="${GITHUB_SHA}"
          PR_NUM="${{ steps.create_pr.outputs.pr_number }}"
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh pr list --head "${BRANCH}" --base main --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -n "$PR_NUM" ]; then
            PR_STATE=$(gh pr view "$PR_NUM" --json state -q '.state' 2>/dev/null || echo "")
            if [ "$PR_STATE" = "MERGED" ]; then
              echo "✅ PR #${PR_NUM} is already merged into main."
              echo "- **Auto-Merge:** ✅ PR #${PR_NUM} already merged" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            PR_DATA=$(gh pr view "$PR_NUM" --json isDraft,title 2>/dev/null || echo "{}")
            IS_DRAFT=$(echo "$PR_DATA" | jq -r '.isDraft // false')
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')

            if [ "$IS_DRAFT" = "true" ] || echo "$PR_TITLE" | grep -qiE '\[(wip|draft)\]'; then
              echo "ℹ️ PR #${PR_NUM} is marked as Draft/WIP. Skipping auto-merge."
              echo "- **Auto-Merge:** ⏸️ Paused (Draft/WIP PR)" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            CURRENT_HEAD=$(gh pr view "$PR_NUM" --json headRefOid -q '.headRefOid')
            if [ "$CURRENT_HEAD" != "$TESTED_HEAD" ]; then
              echo "::error::Branch changed after CI started (${TESTED_HEAD:0:8} -> ${CURRENT_HEAD:0:8}). Refusing to merge untested code."
              exit 1
            fi

            echo "Attempting auto-merge for PR #${PR_NUM} (${BRANCH} → main)..."
            if ! gh pr merge "$PR_NUM" --merge --match-head-commit "$TESTED_HEAD" \
              --subject "Auto-merge ${BRANCH} into main (#${PR_NUM})" 2>&1; then
              echo "::error::GitHub did not complete the merge. Deployment will not run for an unmerged commit."
              echo "- **Auto-Merge:** ❌ GitHub rejected the merge; inspect branch protection/checks" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            # Obtain the actual merge commit before synchronizing or deploying.
            MERGE_SHA=""
            for ATTEMPT in $(seq 1 24); do
              PR_DATA=$(gh pr view "$PR_NUM" --json state,headRefOid,mergeCommit)
              PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
              CURRENT_HEAD=$(echo "$PR_DATA" | jq -r '.headRefOid')
              if [ "$CURRENT_HEAD" != "$TESTED_HEAD" ]; then
                echo "::error::PR head changed while waiting for merge."
                exit 1
              fi
              if [ "$PR_STATE" = "MERGED" ]; then
                MERGE_SHA=$(echo "$PR_DATA" | jq -r '.mergeCommit.oid // empty')
                break
              fi
              sleep 5
            done

            if [ -z "$MERGE_SHA" ]; then
              echo "::error::PR #${PR_NUM} did not reach MERGED state. Deployment was skipped."
              exit 1
            fi

            echo "✅ PR #${PR_NUM} merged as ${MERGE_SHA}."
            echo "- **Auto-Merge:** ✅ Merged as \`${MERGE_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY

            # Keep the developer branch at the merge result. This fast-forward
            # safely fails instead of overwriting concurrent developer work.
            git fetch origin \
              "main:refs/remotes/origin/main" \
              "${BRANCH}:refs/remotes/origin/${BRANCH}"
            if git push origin "${MERGE_SHA}:refs/heads/${BRANCH}"; then
              echo "- **Branch Sync:** ✅ \`${BRANCH}\` fast-forwarded to merged main" >> $GITHUB_STEP_SUMMARY
            else
              echo "::warning::The branch changed after merge; skipped branch sync without overwriting new work."
              echo "- **Branch Sync:** ⚠️ Skipped because new work was pushed" >> $GITHUB_STEP_SUMMARY
            fi

            echo "🚀 Triggering deployment of confirmed merge ${MERGE_SHA:0:8}..."
            gh workflow run deploy.yml --ref main -f deploy_sha="$MERGE_SHA"
            echo "- **CD Deployment:** 🚀 Triggered for \`${MERGE_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No open PR found for branch ${BRANCH}."
          fi
