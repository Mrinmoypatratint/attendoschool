name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier hibernation
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Keep-Alive Ping to Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.BACKEND_URL || 'https://attendoschool-backend.onrender.com' }}"
          HEALTH_URL="${TARGET_URL%/}/api/health"
          echo "Sending keep-alive ping to $HEALTH_URL at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo "000")
          echo "Response HTTP Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Backend is awake, operational and reporting healthy."
          else
            echo "NOTICE: Received status $HTTP_STATUS (backend may be waking up or DNS resolving)."
          fi
