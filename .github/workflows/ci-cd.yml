name: AttendoSchool CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Typecheck & Build
        working-directory: ./backend
        run: |
          npx tsc --noEmit
          npm run build

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Typecheck & Production Build
        working-directory: ./frontend
        run: |
          npx tsc --noEmit
          npm run build

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment Instructions Notice
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "=========================================================================="
          echo "CI Checks Passed! Continuous Deployment to Vercel is ready."
          echo "To auto-deploy via GitHub Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and"
          echo "VERCEL_PROJECT_ID to your GitHub Repository Secrets."
          echo "Or simply connect your GitHub repo in vercel.com for 1-click zero-config"
          echo "automatic continuous deployments."
          echo "=========================================================================="
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
