name: AttendoSchool CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Typecheck & Build
        working-directory: ./backend
        run: |
          npx tsc --noEmit
          npm run build

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Typecheck & Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
        run: |
          npx tsc --noEmit
          npm run build

  deploy-hostinger-vps:
    name: Deploy Full-Stack to Hostinger VPS (SSH & PM2)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS over SSH
        if: ${{ secrets.HOSTINGER_VPS_HOST != '' && (secrets.HOSTINGER_VPS_SSH_KEY != '' || secrets.HOSTINGER_VPS_PASSWORD != '') }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || 22 }}
          script: |
            set -e
            echo "🔄 Updating AttendoSchool on Hostinger VPS..."
            cd /var/www/attendoschool
            git pull origin main
            npm --prefix backend ci
            npm --prefix frontend ci
            npm run build
            pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Deployment completed on https://attendoschool.optinetinnovations.in"

      - name: Hostinger VPS Setup Instructions Notice
        if: ${{ secrets.HOSTINGER_VPS_HOST == '' || (secrets.HOSTINGER_VPS_SSH_KEY == '' && secrets.HOSTINGER_VPS_PASSWORD == '') }}
        run: |
          echo "=========================================================================="
          echo "🚀 HOSTINGER VPS CI/CD PIPELINE READY"
          echo "Target Domain: https://attendoschool.optinetinnovations.in"
          echo "=========================================================================="
          echo "Both Frontend and Backend passed all build and typecheck tests!"
          echo ""
          echo "To enable 100% automated fullstack deployment on every git push, add:"
          echo "GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
          echo ""
          echo "1. HOSTINGER_VPS_HOST     : Your Hostinger VPS IP Address"
          echo "2. HOSTINGER_VPS_USER     : 'root' or your sudo username"
          echo "3. HOSTINGER_VPS_SSH_KEY  : Your SSH Private Key (or HOSTINGER_VPS_PASSWORD)"
          echo "4. HOSTINGER_VPS_PORT     : 22 (Default)"
          echo "=========================================================================="
