name: AttendoSchool CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Typecheck & Build
        working-directory: ./backend
        run: |
          npx tsc --noEmit
          npm run build

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Typecheck & Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://attendoschool-backend.onrender.com/api' }}
        run: |
          npx tsc --noEmit
          npm run build

  deploy-hostinger-web:
    name: Deploy to Hostinger Web Hosting (FTP/FTPS)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Hostinger
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://attendoschool-backend.onrender.com/api' }}
        run: npm run build

      - name: Deploy to Hostinger via FTPS
        if: ${{ secrets.HOSTINGER_FTP_SERVER != '' && secrets.HOSTINGER_FTP_USERNAME != '' && secrets.HOSTINGER_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          protocol: ftps
          dangerous-clean-slate: false

      - name: Hostinger FTP Credentials Notice
        if: ${{ secrets.HOSTINGER_FTP_SERVER == '' || secrets.HOSTINGER_FTP_USERNAME == '' || secrets.HOSTINGER_FTP_PASSWORD == '' }}
        run: |
          echo "=========================================================================="
          echo "🚀 HOSTINGER WEB HOSTING CI/CD READY"
          echo "Target Domain: https://attendoschool.optinetinnovations.in"
          echo "=========================================================================="
          echo "To enable automatic upload on every git push, add these 3 GitHub Secrets:"
          echo "GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
          echo ""
          echo "1. HOSTINGER_FTP_SERVER   : Hostinger FTP Host/IP (e.g. ftp.optinetinnovations.in or IP)"
          echo "2. HOSTINGER_FTP_USERNAME : Your Hostinger FTP Username"
          echo "3. HOSTINGER_FTP_PASSWORD : Your Hostinger FTP Password"
          echo "4. HOSTINGER_SERVER_DIR   : 'public_html/' (Optional, defaults to public_html/)"
          echo "=========================================================================="

  deploy-hostinger-vps:
    name: Deploy Full-Stack to Hostinger VPS (SSH & PM2)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.HOSTINGER_VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_VPS_PASSWORD }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || 22 }}
          script: |
            set -e
            echo "🔄 Updating AttendoSchool on Hostinger VPS..."
            cd /var/www/attendoschool
            git pull origin main
            npm --prefix backend ci
            npm --prefix frontend ci
            npm run build
            pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Deployment completed on https://attendoschool.optinetinnovations.in"
