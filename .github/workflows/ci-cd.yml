name: AttendoSchool CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Typecheck & Build
        working-directory: ./backend
        run: |
          npx tsc --noEmit
          npm run build

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Typecheck & Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://attendoschool-backend.onrender.com/api' }}
        run: |
          npx tsc --noEmit
          npm run build

  deploy-frontend-hostinger:
    name: Deploy Frontend to Hostinger (public_html)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Hostinger Production
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://attendoschool-backend.onrender.com/api' }}
        run: npm run build

      - name: Deploy to Hostinger via FTPS
        if: ${{ secrets.HOSTINGER_FTP_SERVER != '' && secrets.HOSTINGER_FTP_USERNAME != '' && secrets.HOSTINGER_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/attendoschool/' }}
          local-dir: ./frontend/dist/
          protocol: ftps
          dangerous-clean-slate: false

      - name: Hostinger Credentials Setup Notice
        if: ${{ secrets.HOSTINGER_FTP_SERVER == '' || secrets.HOSTINGER_FTP_USERNAME == '' || secrets.HOSTINGER_FTP_PASSWORD == '' }}
        run: |
          echo "=========================================================================="
          echo "⚠️ HOSTINGER DEPLOYMENT NOTICE: Missing GitHub Secrets"
          echo "Target Domain: https://attendoschool.optinetinnovations.in"
          echo "=========================================================================="
          echo "The frontend was successfully built and tested."
          echo "To enable automatic deployment to Hostinger, add these Secrets in GitHub:"
          echo "GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
          echo ""
          echo "1. HOSTINGER_FTP_SERVER   : Hostinger FTP Server Host/IP (e.g. ftp.optinetinnovations.in)"
          echo "2. HOSTINGER_FTP_USERNAME : Your Hostinger FTP Username"
          echo "3. HOSTINGER_FTP_PASSWORD : Your Hostinger FTP Password"
          echo "4. HOSTINGER_SERVER_DIR   : (Optional) 'public_html/attendoschool/'"
          echo "5. VITE_API_URL           : (Optional) Backend API URL (default: https://attendoschool-backend.onrender.com/api)"
          echo "=========================================================================="
