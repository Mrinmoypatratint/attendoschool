services:
  # -------------------------------------------------------------
  # AttendoSchool Backend Web Service (Node.js / Express 5)
  # Pure Google Cloud Firestore (Zero PostgreSQL dependency)
  # -------------------------------------------------------------
  - type: web
    name: attendoschool-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DRIVER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: attendoschool
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: COMPANY_NAME
        value: "AttendoSchool Platform"
      - key: COMPANY_GST_RATE
        value: "18"
