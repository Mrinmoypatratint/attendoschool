services:
  # -------------------------------------------------------------
  # AttendoSchool Backend Web Service (Node.js / Express 5)
  # Pure Google Cloud Firestore (Zero PostgreSQL dependency)
  # -------------------------------------------------------------
  - type: web
    name: attendoschool-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DRIVER
        value: postgres
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      # ── Firebase Credentials ──
      - key: FIREBASE_PROJECT_ID
        value: attendoschool
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@attendoschool.iam.gserviceaccount.com
      # IMPORTANT: Set FIREBASE_PRIVATE_KEY and FIREBASE_SERVICE_ACCOUNT
      # manually in the Render Dashboard > Environment tab.
      # They contain multi-line secrets that cannot be safely stored in YAML.
      # ── SMTP Email Configuration (Gmail) ──
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info.sahayog24x7@gmail.com
      - key: SMTP_PASS
        sync: false  # Enter in Render Dashboard > Environment
      - key: SMTP_FROM
        value: "AttendoSchool <info.sahayog24x7@gmail.com>"
      - key: SMTP_FROM_NAME
        value: "AttendoSchool"
      - key: SMTP_REPLY_TO
        value: info.sahayog24x7@gmail.com
      - key: EMAIL_ENABLED
        value: "true"
      # ── Brevo HTTPS Email Gateway (Port 443 - 100% Free on Render) ──
      - key: BREVO_API_KEY
        sync: false  # Enter Brevo API Key (xkeysib-...) in Render Dashboard
      - key: BREVO_SENDER_EMAIL
        value: "info.sahayog24x7@gmail.com"
      - key: BREVO_SENDER_NAME
        value: "AttendoSchool"
      # ── Google Apps Script Gmail Webhook Relay (Port 443 - 100% Free Gmail) ──
      - key: GMAIL_RELAY_URL
        sync: false
      # ── Application URLs ──
      - key: APP_BASE_URL
        value: https://attendoschool.optinetinnovations.in
      - key: FRONTEND_URL
        value: https://attendoschool.optinetinnovations.in
      - key: COMPANY_NAME
        value: "AttendoSchool Platform"
      - key: COMPANY_GST_RATE
        value: "18"
