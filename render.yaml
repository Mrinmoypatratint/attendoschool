services:
  # -------------------------------------------------------------
  # AttendoSchool Backend Web Service (Node.js / Express 5)
  # -------------------------------------------------------------
  - type: web
    name: attendoschool-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: attendoschool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: COMPANY_NAME
        value: "AttendoSchool Platform"
      - key: COMPANY_GST_RATE
        value: "18"

databases:
  # -------------------------------------------------------------
  # AttendoSchool PostgreSQL 16 Database
  # -------------------------------------------------------------
  - name: attendoschool-db
    databaseName: attendoschool
    user: attendoschool_admin
    plan: free
